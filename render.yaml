# Render Blueprint for the API. Frontends (web + admin) are deployed on Vercel - see README.
services:
  - type: web
    name: certificates-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # Chromium needs RAM; free (512 MB, sleeps) is not recommended
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL    # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL         # your participant site on Vercel, e.g. https://certs.example.com
        sync: false
      - key: API_URL         # this service's public URL, e.g. https://certificates-api.onrender.com
        sync: false
      - key: TRUST_PROXY     # Vercel proxy + Render load balancer
        value: "2"
      - key: STORAGE_DRIVER  # Render disks are ephemeral: use an S3-compatible bucket (Backblaze B2, R2, S3)
        value: s3
      - key: STORAGE_URL
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL     # only needed to run the seed script from the Render shell
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
